    <!-- Dynamic F Monogram -->
    <path d="M19 19 H35 C36.1 19 37 19.9 37 21 C37 22.1 36.1 23 35 23 H24 V27.5 H33 C34.1 27.5 35 28.4 35 29.5 C35 30.6 34.1 31.5 33 31.5 H24 V41 C24 42.1 23.1 43 22 43 C20.9 43 20 42.1 20 41 V20 C20 19.45 20.45 19 21 19 Z" fill="#ffffff" />
    <!-- Vibrant forward-moving pulse accent -->
    <circle cx="37" cy="21" r="3" fill="url(#accent_grad)" />
    <circle cx="35" cy="30" r="2.5" fill="url(#accent_grad)" />
  </g>

  <!-- Brand Typography -->
  <text x="60" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
    Fin<tspan fill="#2563eb">o</tspan>xis
